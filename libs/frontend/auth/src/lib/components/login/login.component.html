<div class="login-container page-stage">
  <section class="login-card card card-lg">
    <span class="watermark material-symbols-outlined" aria-hidden="true">military_tech</span>

    <div class="login-brand">
      <span class="login-mark" aria-hidden="true"><span class="material-symbols-outlined">shield_person</span></span>
      <span class="t-label-caps c-gold">RoyalTeam</span>
      <h1 class="t-headline-lg login-title">RoyalTeam BIS List</h1>
      <p class="t-body-default c-secondary">RoyalTeam — Loot Reservations</p>
    </div>

    <hr class="divider" />

    <div class="stack login-actions">

        <img class="google-icon" src="/assets/google_icon.png" alt="" aria-hidden="true" />

      </button>
    </div>
  </section>
</div>
