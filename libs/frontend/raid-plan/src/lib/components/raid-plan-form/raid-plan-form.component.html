<div class="form-page">
  <div class="form-page__header">
    <a class="back-link" (click)="cancel()">← Terug</a>
    <h1>⚔️ Nieuw raidplan</h1>
  </div>

  <div class="form-layout form-layout--single">
    <div class="settings-panel">
      <section class="settings-section">
        <h2 class="settings-section__title">📅 Wanneer &amp; Wat</h2>

        <div class="date-time-row">
          <div class="field">
            <label class="field__label">Datum</label>
            <input
              class="field__input"
              type="date"
              [ngModel]="scheduledDate()"
              (ngModelChange)="scheduledDate.set($event)"
            />
          </div>
          <div class="field field--time">
            <label class="field__label">Tijd</label>
            <select class="field__input" [ngModel]="scheduledTime()" (ngModelChange)="scheduledTime.set($event)">
              @for (t of timeOptions; track t) {
                <option [value]="t">{{ t }}</option>
              }
            </select>
          </div>
        </div>

        <div class="field">
          <label class="field__label">Raid seizoen</label>
          <select class="field__input" [ngModel]="selectedSeasonId()" (ngModelChange)="selectedSeasonId.set($event)">
            <option value="">— Kies een seizoen —</option>
            @for (season of seasons(); track season.id) {
              <option [value]="season.id">{{ season.name }}</option>
            }
          </select>
        </div>

        <div class="field">
          <label class="field__label">Moeilijkheidsgraad</label>
          <div class="difficulty-toggle">
            @for (d of difficulties; track d) {
              <button
                class="difficulty-btn difficulty-btn--{{ d.toLowerCase() }}"
                [class.difficulty-btn--active]="selectedDifficulty() === d"
                (click)="selectedDifficulty.set(d)"
                type="button"
              >
                {{ d }}
              </button>
            }
          </div>
        </div>

        <div class="field">
          <label class="field__label">Notities <span class="optional">(optioneel)</span></label>
          <textarea
            class="field__input"
            rows="3"
            [ngModel]="notes()"
            (ngModelChange)="notes.set($event)"
            placeholder="Bijv. 'Focus op eerste 3 bosses'"
          ></textarea>
        </div>
      </section>

      <div class="form-actions">
        <button class="btn btn--ghost" (click)="cancel()" [disabled]="saving()">Annuleren</button>
        <button class="btn btn--gold" (click)="save()" [disabled]="saving() || !selectedSeasonId() || !scheduledAt()">
          @if (saving()) {
            Opslaan…
          } @else {
            ⚔️ Aanmaken
          }
        </button>
      </div>
    </div>
  </div>
</div>
