<!-- TOAST NOTIFICATION CONTAINER -->
<div class="fixed top-16 right-6 z-50 flex flex-col gap-space-sm pointer-events-none" id="toast-container">
<div class="pointer-events-auto transform transition-all duration-300 translate-y-0 opacity-100 flex items-center gap-space-sm bg-surface-tier-2 px-space-md py-space-sm shadow-xl rounded border-l-2 border-primary" id="toast-success">
<span class="material-symbols-outlined text-primary text-[18px]">verified</span>
<div class="flex flex-col">
<span class="font-body-medium text-body-medium text-text-primary">Webhook Synchronized</span>
<span class="font-body-code text-body-code text-text-secondary">Dispatched to #mythic-announcements</span>
</div>
<button class="text-text-muted hover:text-text-primary ml-space-md" onclick="this.parentElement.remove()">
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
</div>
</div>
