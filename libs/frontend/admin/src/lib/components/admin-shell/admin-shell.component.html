<div class="admin-shell">
  <aside class="sidebar admin-sidebar" aria-label="Beheer">
    <div class="sidebar__label">Beheer</div>

    <nav class="sidebar__nav">
      @for (item of navItems; track item.path) {
        <a class="nav-item" [routerLink]="item.path" routerLinkActive="active">
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          {{ item.label }}
        </a>
      }
    </nav>

    @if (isSuperUser()) {
      <div class="admin-sidebar__team">
        <span class="t-label-caps c-muted">Team</span>
        <div class="segmented segmented--block" role="group" aria-label="Team">
          <button
            type="button"
            class="segmented__item"
            style="--item-color: var(--team-crusaders)"
            [class.is-active]="viewedTeam() === Team.CRUSADERS"
            [attr.aria-pressed]="viewedTeam() === Team.CRUSADERS"
            (click)="selectTeam(Team.CRUSADERS)"
          >
            Crusaders
          </button>
          <button
            type="button"
            class="segmented__item"
            style="--item-color: var(--team-templars)"
            [class.is-active]="viewedTeam() === Team.TEMPLARS"
            [attr.aria-pressed]="viewedTeam() === Team.TEMPLARS"
            (click)="selectTeam(Team.TEMPLARS)"
          >
            Templars
          </button>
        </div>
      </div>
    }

    @if (season(); as s) {
      <div class="sidebar__footer admin-sidebar__season">
        <div class="admin-sidebar__season-head">
          <span class="t-label-caps c-muted">Seizoen</span>
          @if (s.isActive) {
            <span class="badge badge-success badge--dot">Actief</span>
          }
        </div>
        <span class="t-title-sm">{{ s.name }}</span>
      </div>
    }
  </aside>

  @if (isSuperUser()) {
    <div class="admin-mobile-team show-mobile">
      <div class="segmented segmented--block" role="group" aria-label="Team">
        <button
          type="button"
          class="segmented__item"
          style="--item-color: var(--team-crusaders)"
          [class.is-active]="viewedTeam() === Team.CRUSADERS"
          [attr.aria-pressed]="viewedTeam() === Team.CRUSADERS"
          (click)="selectTeam(Team.CRUSADERS)"
        >
          Crusaders
        </button>
        <button
          type="button"
          class="segmented__item"
          style="--item-color: var(--team-templars)"
          [class.is-active]="viewedTeam() === Team.TEMPLARS"
          [attr.aria-pressed]="viewedTeam() === Team.TEMPLARS"
          (click)="selectTeam(Team.TEMPLARS)"
        >
          Templars
        </button>
      </div>
    </div>
  }

  <main class="admin-content">
    <router-outlet />
  </main>

  <!-- Mobile bottom navigation -->
  <nav class="bottom-nav admin-bottom-nav" aria-label="Beheer">
    @for (item of navItems; track item.path) {
      <a class="bottom-nav__item" [routerLink]="item.path" routerLinkActive="active">
        <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
        <span class="admin-bottom-nav__label">{{ item.label }}</span>
      </a>
    }
  </nav>
</div>
