services:
  # NestJS Backend
  - type: web
    name: crusaders-bis-list-api
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && ./node_modules/.bin/nx build crusaders-bis-list-backend --configuration=production
    startCommand: node dist/apps/crusaders-bis-list-backend/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: DATABASE_SSL
        value: 'true'
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false # e.g. https://crusaders-bis-list-api.onrender.com/api/auth/google/callback
      - key: BLIZZARD_CLIENT_ID
        sync: false
      - key: BLIZZARD_CLIENT_SECRET
        sync: false
      - key: BNET_CALLBACK_URL
        sync: false # e.g. https://crusaders-bis-list-api.onrender.com/api/auth/bnet/callback
      - key: BLIZZARD_REGION
        value: eu
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false # e.g. https://crusaders-bis-list.onrender.com
      - key: DISCORD_WEBHOOK_URL
        sync: false # Discord webhook URL for raid plan notifications

  # Discord Bot (Background Worker)
  - type: worker
    name: crusaders-bis-list-discord-bot
    env: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && ./node_modules/.bin/nx build discord-bot --configuration=production
    startCommand: node dist/apps/discord-bot/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # Same DB as the API
      - key: DATABASE_SSL
        value: 'true'
      - key: DISCORD_BOT_TOKEN
        sync: false # Bot token from Discord Developer Portal
      - key: DISCORD_CLIENT_ID
        sync: false # Application ID from Discord Developer Portal
      - key: DISCORD_GUILD_ID
        sync: false # Your Discord server ID (right-click server → Copy Server ID)

  # Angular Frontend (Static Site)
  - type: web
    name: crusaders-bis-list
    env: static
    buildCommand: npm ci --include=dev && ./node_modules/.bin/nx build crusaders-bis-list-frontend --configuration=production
    staticPublishPath: dist/apps/crusaders-bis-list-frontend/browser
    envVars:
      - key: NODE_ENV
        value: production
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
